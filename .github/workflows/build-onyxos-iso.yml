name: Build and Release OnyxOS ISO

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'repo-updates/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iso:
    name: Build OnyxOS 2.1 Live ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          echo "=== Espace disque initial ==="
          df -h
          echo "Suppression des paquets volumineux préinstallés..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /var/lib/docker
          sudo apt-get clean
          echo "=== Espace disque libéré ==="
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xorriso \
            erofs-utils \
            erofsfuse \
            fuse3 \
            squashfs-tools \
            python3 \
            python3-pil \
            curl \
            rpm \
            createrepo-c \
            zip

      - name: Download official Fedora KDE Live 45 source ISO
        run: |
          ISO_URL="https://download.fedoraproject.org/pub/fedora/linux/releases/45/KDE/x86_64/iso/Fedora-KDE-Desktop-Live-45-1.4.x86_64.iso"
          echo "Téléchargement de l'ISO source officielle Fedora 45 KDE..."
          curl -fL -C - --retry 5 --retry-delay 5 -o Fedora-KDE-Desktop-Live-45-1.4.x86_64.iso "$ISO_URL"
          ls -lh Fedora-KDE-Desktop-Live-45-1.4.x86_64.iso

      - name: Rebuild OnyxOS Live ISO
        run: |
          sudo modprobe fuse 2>/dev/null || true
          chmod +x rebuild-live-iso.sh scripts/*.sh assets/generate_assets.py
          sudo ONYXOS_REGEN_ASSETS=1 bash ./rebuild-live-iso.sh
          # Assurer les permissions pour l'étape zip non-root
          sudo chown -R $USER:$USER .
          chmod 666 OnyxOS-*.iso* 2>/dev/null || true
          echo "Fichiers ISO générés :"
          ls -lh OnyxOS-*.iso*
          cat OnyxOS-2.1-live-x86_64.iso.sha256

      - name: Split ISO into multi-volume ZIP (< 2GB per part)
        run: |
          echo "Découpage de l'ISO en volumes ZIP de 1900 Mo (mode Store -0 instantané)..."
          zip -0 -s 1900m OnyxOS-2.1-live-x86_64.zip OnyxOS-2.1-live-x86_64.iso
          echo "Volumes créés :"
          ls -lh OnyxOS-2.1-live-x86_64.z* OnyxOS-2.1-live-x86_64.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1-latest
          name: "OnyxOS 2.1 (Plasma Edition) Live ISO"
          body: |
            ## OnyxOS 2.1 (Plasma Edition) — Release Officielle Cloud

            Bienvenue sur **OnyxOS 2.1** (Plasma Edition) ! Cette version apporte une refonte visuelle complète sans aucun flou ("Obsidian Matte & Electric Violet"), des performances de pointe, des mises à jour DNF ultra-rapides sans freeze et une prise en charge multimédia/jeux complète.

            ### ✨ Nouveautés de la v2.1 :
            - **Design KDE Plasma 6 "Obsidian Matte" (ZÉRO FLOU)** :
              - Fenêtres épurées sans bordures latérales via `OnyxAurorae`.
              - Thème Plasma SVG `OnyxTheme` noir profond mat (`#0F0D18`) opaque à 95 % avec fine bordure violette `#8B5CF6`.
              - Barre supérieure 28 px flottante & dock centré 62 px flottant avec lanceurs épinglés.
              - Konsole noir mat `#0D0B14` sans flou avec police `JetBrains Mono`.
              - Flou KWin entièrement désactivé pour un rendu ultra-net et réactif.
            - **Mises à jour DNF ultra-rapides & Zéro Freeze** :
              - 10 téléchargements simultanés (`max_parallel_downloads=10`, `fastestmirror=True`).
              - Hook DNF5 transparent qui laisse passer 100 % des mises à jour Fedora sans conflit de paquets.
              - Raccourci `onyxos-update` (`sudo dnf upgrade --refresh -y`).
            - **Multimédia & Jeux clés en main** :
              - Dépôts RPM Fusion Free & Nonfree activés avec codecs complets (`ffmpeg`, GStreamer, VA-API).
              - Flathub préconfiguré pour KDE Discover.
              - Wine, Winetricks, Gamemode, Vulkan et association automatique `.exe`.
            - **Système, Sécurité & Vie Privée** :
              - Noyau basse latence `preempt=full`, swap zram en `zstd`, `vm.max_map_count=2147483642`, congestion TCP BBR.
              - DNS Cloudflare/Quad9 dans `systemd-resolved`, `fstrim.timer` activé et télémétrie Firefox désactivée.

            ---

            ### 📦 Téléchargement & Extraction de l'ISO :
            L'image ISO est découpée en volumes multi-parties `< 2 Go` :
            - `OnyxOS-2.1-live-x86_64.z01`
            - `OnyxOS-2.1-live-x86_64.zip`

            #### Sous Windows (avec 7-Zip ou WinRAR) :
            1. Téléchargez tous les fichiers `.z01` et `.zip` dans le **même dossier**.
            2. Clic droit sur `OnyxOS-2.1-live-x86_64.zip` → **7-Zip** → **Extraire ici**.
            3. Vous obtenez directement `OnyxOS-2.1-live-x86_64.iso`.

            #### Sous Linux / macOS :
            ```bash
            zip -s 0 OnyxOS-2.1-live-x86_64.zip --out OnyxOS-2.1-single.zip
            unzip OnyxOS-2.1-single.zip
            sha256sum -c OnyxOS-2.1-live-x86_64.iso.sha256
            ```
          files: |
            OnyxOS-2.1-live-x86_64.zip
            OnyxOS-2.1-live-x86_64.z*
            OnyxOS-2.1-live-x86_64.iso.sha256
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
